
name: Build MT7601U Module

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            build-essential clang lld llvm

      - name: Download Google Kernel
        run: |
          TAG=android12-5.10-2024-05_r1
          git init kernel
          git -C kernel remote add origin https://android.googlesource.com/kernel/common.git
          git -C kernel fetch --depth=1 origin "refs/tags/$TAG"
          git -C kernel checkout --detach FETCH_HEAD

      - name: Configure kernel
        run: |
          cd kernel
          make O=out ARCH=arm64 LLVM=1 gki_defconfig

          scripts/config --file out/.config \
            --enable MODULES \
            --enable USB_SUPPORT \
            --enable USB \
            --enable WIRELESS \
            --enable NETDEVICES \
            --enable WLAN \
            --enable WLAN_VENDOR_MEDIATEK \
            --module CFG80211 \
            --module MAC80211 \
            --module MT7601U

          make O=out ARCH=arm64 LLVM=1 olddefconfig

          grep -q '^CONFIG_MT7601U=m$' out/.config

      - name: Build MT7601U
        run: |
          cd kernel
          make O=out ARCH=arm64 LLVM=1 -j2 \
            drivers/net/wireless/mediatek/mt7601u/mt7601u.ko

      - name: Verify module
        run: |
          find kernel/out -name mt7601u.ko -print
          test -f kernel/out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: mt7601u-module
          path: kernel/out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko
