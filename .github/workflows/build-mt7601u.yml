
name: Build Google GKI 5.10.209 NetHunter

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex build-essential \
            libssl-dev libelf-dev libncurses-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            kmod pahole python3 cpio \
            curl tar xz-utils

      - name: Download Android Clang
        run: |
          set -e

          TOOLCHAIN_COMMIT=b669748458572622ed716407611633c5415da25c

          git init clang-toolchain
          git -C clang-toolchain remote add origin \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86

          git -C clang-toolchain fetch \
            --depth=1 --filter=blob:none origin "$TOOLCHAIN_COMMIT"

          git -C clang-toolchain checkout --detach FETCH_HEAD
          git -C clang-toolchain sparse-checkout init --cone
          git -C clang-toolchain sparse-checkout set clang-r416183b

          TOOLCHAIN="$GITHUB_WORKSPACE/clang-toolchain/clang-r416183b"

          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

          "$TOOLCHAIN/bin/clang" --version
          "$TOOLCHAIN/bin/ld.lld" --version

          test -x "$TOOLCHAIN/bin/clang"
          test -x "$TOOLCHAIN/bin/ld.lld"

      - name: Download Google Kernel
        run: |
          set -e

          TAG=android12-5.10-2024-05_r1

          git init kernel
          git -C kernel remote add origin \
            https://android.googlesource.com/kernel/common.git

          git -C kernel fetch --depth=1 origin "refs/tags/$TAG"
          git -C kernel checkout --detach FETCH_HEAD

          echo "=== KERNEL SOURCE ==="
          git -C kernel rev-parse HEAD
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' kernel/Makefile

      - name: Configure NetHunter
        working-directory: kernel
        run: |
          set -e

          make O=out ARCH=arm64 \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            gki_defconfig

          scripts/config --file out/.config \
            --enable MODULES \
            --enable USB_SUPPORT \
            --enable USB \
            --enable WIRELESS \
            --enable NETDEVICES \
            --enable WLAN \
            --enable WLAN_VENDOR_MEDIATEK \
            --module CFG80211 \
            --module MAC80211 \
            --module MT7601U

          make O=out ARCH=arm64 \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig

          echo "=== CONFIGURATION ==="
          grep -E '^CONFIG_(MODULES|USB|WIRELESS|WLAN|CFG80211|MAC80211|WLAN_VENDOR_MEDIATEK|MT7601U)=' out/.config

          grep -q '^CONFIG_MODULES=y$' out/.config
          grep -q '^CONFIG_CFG80211=m$' out/.config
          grep -q '^CONFIG_MAC80211=m$' out/.config
          grep -q '^CONFIG_MT7601U=m$' out/.config

      - name: Verify ARM64 compiler target
        run: |
          set -e

          echo "=== CLANG VERSION ==="
          clang --version

          echo "=== ARM64 TARGET ==="
          clang --target=aarch64-linux-gnu -dumpmachine

          clang --target=aarch64-linux-gnu \
            -dM -E -x c /dev/null | grep __aarch64__

      - name: Build kernel and modules
        working-directory: kernel
        run: |
          set -e

          make -j2 O=out ARCH=arm64 \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image modules

      - name: Collect build output
        working-directory: kernel
        run: |
          set -e

          mkdir -p ../release/modules

          cp out/arch/arm64/boot/Image ../release/Image

          gzip -n -9 -c out/arch/arm64/boot/Image \
            > ../release/Image.gz

          cp out/.config ../release/kernel.config
          cp out/Module.symvers ../release/Module.symvers
          cp out/System.map ../release/System.map

          find out -name '*.ko' \
            -exec cp --parents {} ../release/modules/ \;

          echo "=== KERNEL IMAGE ==="
          file ../release/Image
          file ../release/Image.gz

          echo "=== MT7601U MODULE ==="
          MT_MODULE=$(find out -name mt7601u.ko | head -n 1)

          test -n "$MT_MODULE"
          modinfo "$MT_MODULE"

          echo "=== MODULE COUNT ==="
          find out -name '*.ko' | wc -l

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: google-gki-5.10.209-nethunter
          path: release/
          if-no-files-found: error
          retention-days: 14
