
name: Build Google GKI 5.10.209 NetHunter

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex build-essential \
            libssl-dev libelf-dev libncurses-dev \
            clang-14 lld-14 llvm-14 \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            kmod pahole python3 cpio

      - name: Download Google GKI 5.10.209
        run: |
          TAG=android12-5.10-2024-05_r1

          git init kernel
          git -C kernel remote add origin \
            https://android.googlesource.com/kernel/common.git

          git -C kernel fetch --depth=1 origin "refs/tags/$TAG"
          git -C kernel checkout --detach FETCH_HEAD

          echo "=== SOURCE COMMIT ==="
          git -C kernel rev-parse HEAD

      - name: Configure NetHunter wireless
        working-directory: kernel
        run: |
          set -e

          make O=out ARCH=arm64 LLVM=-14 gki_defconfig

          scripts/config --file out/.config \
            --enable MODULES \
            --enable USB_SUPPORT \
            --enable USB \
            --enable WIRELESS \
            --enable NETDEVICES \
            --enable WLAN \
            --enable WLAN_VENDOR_MEDIATEK \
            --module CFG80211 \
            --module MAC80211 \
            --module MT7601U

          make O=out ARCH=arm64 LLVM=-14 olddefconfig

          echo "=== WIRELESS CONFIG ==="
          grep -E '^CONFIG_(MODULES|USB|WIRELESS|WLAN|CFG80211|MAC80211|WLAN_VENDOR_MEDIATEK|MT7601U)=' out/.config

          grep -q '^CONFIG_CFG80211=m$' out/.config
          grep -q '^CONFIG_MAC80211=m$' out/.config
          grep -q '^CONFIG_MT7601U=m$' out/.config

      - name: Build kernel and modules
        working-directory: kernel
        run: |
          set -e

          make -j2 O=out ARCH=arm64 LLVM=-14 \
            Image modules

      - name: Collect build output
        working-directory: kernel
        run: |
          set -e

          mkdir -p ../release/modules

          cp out/arch/arm64/boot/Image ../release/Image

          gzip -n -9 -c out/arch/arm64/boot/Image \
            > ../release/Image.gz

          cp out/.config ../release/kernel.config
          cp out/Module.symvers ../release/Module.symvers
          cp out/System.map ../release/System.map

          find out -name '*.ko' \
            -exec cp --parents {} ../release/modules/ \;

          echo "=== KERNEL ==="
          file ../release/Image

          echo "=== MT7601U MODULE ==="
          find out -name 'mt7601u.ko' -exec modinfo {} \;

          find out -name 'mt7601u.ko' | grep -q .

      - name: Upload kernel and modules
        uses: actions/upload-artifact@v4
        with:
          name: google-gki-5.10.209-nethunter
          path: release/
          if-no-files-found: error
          retention-days: 14
