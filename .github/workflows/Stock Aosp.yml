
name: Build Google GKI 5.10.209 - X6833B Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      # ==========================================
      # 1. INSTALL BUILD DEPENDENCIES
      # ==========================================
      - name: 1. Install Dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            curl \
            flex \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            git \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            lz4 \
            pahole \
            python3 \
            python-is-python3 \
            rsync \
            unzip \
            zip

      # ==========================================
      # 2. CLONE GOOGLE KERNEL + AOSP CLANG
      # ==========================================
      - name: 2. Clone Kernel and Clang r416183b
        run: |
          set -euo pipefail

          echo "===== CLONE GOOGLE COMMON KERNEL ====="

          git clone --depth=1 \
            --branch android12-5.10-2024-05_r1 \
            https://android.googlesource.com/kernel/common \
            kernel_src

          cd kernel_src

          echo "===== SOURCE COMMIT ====="
          git rev-parse HEAD

          SOURCE_VERSION=$(make kernelversion)
          echo "Kernel version: $SOURCE_VERSION"

          if [ "$SOURCE_VERSION" != "5.10.209" ]; then
            echo "ERROR: Unexpected kernel version"
            exit 1
          fi

          cd "$GITHUB_WORKSPACE"

          echo "===== DOWNLOAD AOSP CLANG r416183b ====="

          mkdir -p clang-aosp

          curl -L --fail --retry 3 -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz"

          tar -xzf clang.tar.gz -C clang-aosp
          rm clang.tar.gz

          CLANG_DIR="$GITHUB_WORKSPACE/clang-aosp"

          echo "===== VERIFY CLANG TOOLCHAIN ====="

          test -x "$CLANG_DIR/bin/clang"
          test -x "$CLANG_DIR/bin/ld.lld"
          test -x "$CLANG_DIR/bin/llvm-ar"
          test -x "$CLANG_DIR/bin/llvm-nm"
          test -x "$CLANG_DIR/bin/llvm-strip"

          "$CLANG_DIR/bin/clang" --version
          "$CLANG_DIR/bin/ld.lld" --version

          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"

          echo "Clang r416183b is ready."

      # ==========================================
      # 3. VERIFY SOURCE AND TOOLCHAIN
      # ==========================================
      - name: 3. Verify Build Environment
        run: |
          set -euo pipefail

          echo "===== KERNEL SOURCE ====="
          cd "$GITHUB_WORKSPACE/kernel_src"

          git log -1 --oneline
          make kernelversion

          echo "===== CLANG VERSION ====="
          clang --version

          echo "===== LINKER VERSION ====="
          ld.lld --version

          echo "===== LLVM TOOLS ====="
          llvm-ar --version
          llvm-nm --version
          llvm-strip --version

          echo "===== GCC CROSS COMPILER ====="
          aarch64-linux-gnu-gcc --version

      # ==========================================
      # 4. GENERATE GKI DEFCONFIG
      # ==========================================
      - name: 4. Configure GKI Defconfig
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_src"

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "===== GENERATE GKI DEFCONFIG ====="

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            gki_defconfig

          echo "===== OLDDEFCONFIG ====="

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo "===== CONFIGURATION CHECK ====="

          test -f out/.config

          cp out/.config gki_defconfig_result

          grep -E \
            'CONFIG_ARM64=|CONFIG_MODULES=|CONFIG_GKI' \
            out/.config || true

      # ==========================================
      # 5. CONFIGURE SWAP AND CHECK RESOURCES
      # ==========================================
      - name: 5. Configure Swap and Check Resources
        run: |
          set -euo pipefail
          echo "===== MEMORY BEFORE SWAP ====="
          free -h
          echo "===== DISK SPACE BEFORE SWAP ====="
          df -h /
          echo "===== CREATE 8GB SWAP ====="
          # Pakai nama baru biar nggak tabrakan sama swap bawaan runner
          sudo fallocate -l 8G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          echo "===== MEMORY AFTER SWAP ====="
          free -h

      # ==========================================
      # 6. BUILD KERNEL AND MODULES
      # ==========================================
      - name: 6. Build Kernel and Modules
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_src"

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          JOBS=2
          echo "Build jobs: $JOBS"

          echo "===== BUILD INFORMATION ====="
          echo "Kernel: $(make O=out kernelrelease)"
          echo "Architecture: arm64"
          echo "Compiler:"
          clang --version

          echo "===== START KERNEL BUILD ====="

          set -o pipefail

          make -j"$JOBS" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image modules 2>&1 | tee build.log

          echo "===== VERIFY BUILD OUTPUT ====="

          test -s out/arch/arm64/boot/Image
          test -f out/Module.symvers
          test -f out/.config

          echo "===== KERNEL RELEASE ====="
          make O=out kernelrelease

          echo "===== BUILD COMPLETED ====="

      # ==========================================
      # 7. PREPARE BUILD ARTIFACTS
      # ==========================================
      - name: 7. Prepare Kernel Artifacts
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel_src"

          OUT_DIR="$GITHUB_WORKSPACE/kernel_src/out"
          ARTIFACT_DIR="$GITHUB_WORKSPACE/artifacts"

          mkdir -p "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR/modules"

          echo "===== COPY KERNEL IMAGE ====="

          cp "$OUT_DIR/arch/arm64/boot/Image" \
            "$ARTIFACT_DIR/Image"

          echo "===== CREATE IMAGE.GZ ====="

          gzip -n -9 -c \
            "$OUT_DIR/arch/arm64/boot/Image" \
            > "$ARTIFACT_DIR/Image.gz"

          echo "===== COPY CONFIGURATION ====="

          cp "$OUT_DIR/.config" \
            "$ARTIFACT_DIR/kernel.config"

          cp "$OUT_DIR/Module.symvers" \
            "$ARTIFACT_DIR/Module.symvers"

          echo "===== COPY KERNEL RELEASE ====="

          make O=out kernelrelease \
            > "$ARTIFACT_DIR/kernel.release"

          echo "===== COLLECT MODULES ====="

          (
            cd "$OUT_DIR"
            find . -type f -name '*.ko' \
              -exec cp --parents {} "$ARTIFACT_DIR/modules/" \;
          )

          echo "===== BUILD INFORMATION ====="

          {
            echo "Kernel source: android12-5.10-2024-05_r1"
            echo "Kernel version: $(make O=out kernelrelease)"
            echo "Compiler: Clang r416183b"
            echo "Architecture: arm64"
            echo "Build type: GKI baseline"
            echo "Source commit: $(git rev-parse HEAD)"
          } > "$ARTIFACT_DIR/build-info.txt"

          echo "===== ARTIFACT CONTENTS ====="
          find "$ARTIFACT_DIR" -type f -printf '%P\n'

      # ==========================================
      # 8. UPLOAD BUILD ARTIFACTS
      # ==========================================
      - name: 8. Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Google-GKI-5.10.209-X6833B-Baseline
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      # ==========================================
      # 9. UPLOAD BUILD LOG IF FAILED
      # ==========================================
      - name: 9. Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GKI-5.10.209-Build-Logs
          path: |
            kernel_src/build.log
            kernel_src/out/.config
            kernel_src/out/include/config/kernel.release
          if-no-files-found: warn
          retention-days: 7
