name: Check MT7601U Kernel Configuration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev build-essential

      - name: Download Google Kernel
        run: |
          TAG=android12-5.10-2024-05_r1

          git init kernel
          git -C kernel remote add origin https://android.googlesource.com/kernel/common.git
          git -C kernel fetch --depth=1 origin "refs/tags/$TAG"
          git -C kernel checkout --detach FETCH_HEAD

          git -C kernel show -s --format='%H %s'

      - name: Generate kernel configuration
        run: |
          cd kernel

          make O=out ARCH=arm64 gki_defconfig

          scripts/config --file out/.config \
            --enable MODULES \
            --enable USB_SUPPORT \
            --enable USB \
            --enable WIRELESS \
            --enable NETDEVICES \
            --enable WLAN \
            --enable WLAN_VENDOR_MEDIATEK \
            --module CFG80211 \
            --module MAC80211 \
            --module MT7601U  
            
          make O=out ARCH=arm64 olddefconfig

      - name: Verify MT7601U configuration
        run: |
          cd kernel

          echo "=== FINAL CONFIGURATION ==="
          grep -E 'CONFIG_(MODULES|USB_SUPPORT|USB|WIRELESS|CFG80211|MAC80211|MT7601U)=' out/.config

          grep -q '^CONFIG_MT7601U=m$' out/.config
          echo "SUCCESS: MT7601U is enabled as a kernel module."
